name: bio_explore
description: "Explore the world of creatures"

# Script
# dart fix --apply --code=unused_import
# flutter pub run import_sorter:main
# Launch icon: flutter pub run flutter_launcher_icons
# flutter pub run build_runner build --delete-conflicting-outputs
# flutter pub run build_runner clean
# flutter pub run easy_localization:generate --source-dir 'assets/translations' --output-dir 'lib/generated' --output-file 'translations.g.dart' --format keys
# flutter build apk --flavor development --release -t lib/main_development.dart --build-name 1.0.1 --build-number 6 --no-tree-shake-icons
# flutter build apk --flavor production --release -t lib/main_production.dart --build-name 1.0.1 --build-number 6 --no-tree-shake-icons
# flutter build appbundle --flavor development --release -t lib/main_development.dart --build-name 1.0.1 --build-number 6
# flutter build appbundle --flavor production --release -t lib/main_production.dart --build-name 1.0.1 --build-number 6

# flutter build ios --flavor development --release --no-codesign -t lib/main_development.dart  --build-name 1.0.1 --build-number 6
# flutter build ios --flavor production --release --no-codesign -t lib/main_production.dart --build-name 1.0.1 --build-number 6
# flutter build ios --flavor production --release --no-codesign -t lib/main_production.dart --build-name 1.0.1 --build-number 6 --no-tree-shake-icons

# flutter build windows -t lib/main_production.dart

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

    # For Model
  freezed_annotation: ^2.4.4
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0

  # For Networking
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  #For State Management
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3

  #For log
  talker: ^4.6.11
  talker_flutter: ^4.6.11
  talker_bloc_logger: ^4.6.11
  talker_dio_logger: ^4.6.11

  #Date Time
  syncfusion_flutter_datepicker: ^28.2.6

  #For localization
  slang: ^4.4.1
  slang_flutter: ^4.4.0
  flutter_localization: ^0.3.1

  #For Local
  shared_preferences: ^2.5.2

  #FOR BASE
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.3
  bot_toast: ^4.1.3
  flutter_dotenv: ^5.2.1
  scrollable_positioned_list: ^0.3.8
  dropdown_button2: ^2.3.9
  dotted_border: ^2.1.0
  uuid: ^4.5.0
  flutter_screenutil: ^5.9.3
  readmore: ^3.0.0
  shimmer: ^3.0.0
  loading_animation_widget: ^1.3.0
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.0
  carousel_slider: ^5.0.0
  flutter_typeahead: ^5.2.0

  # For Assets
  flutter_gen: ^5.2.0
  flutter_svg: ^2.0.0

  #For GPS
  location: ^8.0.0
  geolocator: ^13.0.2
  app_settings: ^5.2.0
  google_maps_flutter: ^2.10.0
  latlong2: ^0.9.1

  # For LocalFile
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  file_picker: ^9.0.0
  image_picker: ^1.1.2
  photo_manager: ^3.6.4
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.10.0
#  image_cropper: ^6.0.0
  image_gallery_saver_plus: ^3.0.5
  share_plus: ^10.1.4
  audioplayers: ^6.2.0
#  video_thumbnail: ^0.5.3
  cached_network_image: ^3.4.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.9.0
  freezed: ^2.5.8
  retrofit_generator: ^9.1.9
  slang_build_runner: ^4.4.2

flutter_launcher_icons:
  ios: false
  android: true
  #  remove_alpha_ios: true
  image_path: "assets/images/logo.png"

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    lottie: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/i18n/
    - assets/fonts/
    - assets/icons/
    - .env

  fonts:
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Thin.ttf
          weight: 100
        - asset: assets/fonts/InterDisplay-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/InterDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/InterDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/InterDisplay-Black.ttf
          weight: 900
